<svg width="100" height="100" viewBox="0 0 100 100" fill="none" 
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink">
  <rect id="colorRect" width="100" height="100" fill="#A73636"/>
  <animate 
    xlink:href="#colorRect"
    attributeName="fill" 
    values="#A73636; #3657A7; #36A756; #A736A7; #A73636" 
    dur="10s" 
    repeatCount="indefinite" />
</svg>